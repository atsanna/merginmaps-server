server {
  listen 80;
  server_name _;

  location /ows/ {
    gzip off;
    include fastcgi_params;
    fastcgi_param QUERY_STRING $query_string;
    fastcgi_pass merginmaps-qgis:5555;
    fastcgi_read_timeout 60s;
  }
}
