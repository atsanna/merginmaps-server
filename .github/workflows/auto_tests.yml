name: Auto Tests

on:
  push:
    paths:
      # Run just when the backend changed
      - "server/**"
      - "!server/**/*.md"
      - ".github/workflows/auto_tests.yml"

jobs:
  tests:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: server
            pytest_args: "-v -n auto --cov=mergin --cov-report=term mergin/tests"
          - suite: migration
            pytest_args: "-v mergin/test_migrations"
          # CE suite against workspaces stored in db (mergin_plus package)
          - suite: server-enterprise
            test_enterprise: "1"
            pytest_args: "-v -n auto mergin/tests"
          - suite: enterprise
            pytest_args: "-v -n auto --cov=mergin_plus --cov-report=term mergin_plus/tests"
          - suite: enterprise-migration
            pytest_args: "-v mergin_plus/test_migrations"

    services:
      postgres:
        image: postgres:14
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5435:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5435

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Install deps
        run: |
          cd server
          sudo apt-get -y install libsqlite3-mod-spatialite
          pip install pipenv==2026.8.0
          pipenv install --dev --deploy --verbose --python 3.12

      - name: Run tests
        env:
          TEST_ENTERPRISE: ${{ matrix.test_enterprise || '0' }}
        run: |
          cd server
          pipenv run pytest ${{ matrix.pytest_args }}

